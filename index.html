<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Optimal Enclose Horse</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    @font-face {
      font-family: 'Schoolbell';
      src: url('./Schoolbell-Regular.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }

    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Schoolbell', cursive;
    }

    #gameFrame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }

    #navButtons button {
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      background: rgba(0,0,0,0.7);
      color: white;
      cursor: pointer;
      font-size: 18px;
    }

    #navButtons button:hover {
      background: rgba(0,0,0,0.9);
    }

    /* Bottom overlay */
    #overlay {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      pointer-events: none;
    }

    .panel {
      padding: 6px 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      border-radius: 8px;
      min-width: 60px;
      text-align: center;
      font-size: 18px;
      pointer-events: auto;
    }

    #timer {
      cursor: pointer;
    }

    /* Prev & Next Buttons */
    #prevBtn, #nextBtn {
      position: absolute;
      z-index: 5;
      cursor: pointer;
      background: #1B6B3A;      /* button background */
      color: #BBD3C4;           /* font color */
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      border: none;
      transition: background 0.2s ease; /* smooth hover transition */
    }

    /* Hover effect */
    #prevBtn:hover, #nextBtn:hover {
      background: #249149; /* slightly lighter green */
    }

    /* Desktop ≥1350px */
    @media (min-width: 1350px) {
      #prevBtn {
        left: 27%;
        top: 6%;
        width: 16%;   /* slightly bigger */
        height: 5%;   /* slightly taller */
      }
      #nextBtn {
        right: 27%;
        top: 6%;
        width: 16%;   /* slightly bigger */
        height: 5%;   /* slightly taller */
      }
    }

    /* Desktop 1173–1349px */
    @media (min-width: 1100px) and (max-width: 1349px) {
      #prevBtn {
        left: 18.86%;
        top: 6.19%;
        width: 18.5%;  /* slightly bigger */
        height: 4%;    /* slightly taller */
      }
      #nextBtn {
        right: 18.86%;
        top: 6.19%;
        width: 18.5%;  /* slightly bigger */
        height: 4%;    /* slightly taller */
      }
    }

    /* Desktop mini ≤1099px */
    @media (max-width: 1099px) and (min-width: 700px) {
      #prevBtn {
        left: 12.82%;
        top: 6.5%;
        width: 22%;    /* slightly bigger */
        height: 3.5%;  /* slightly taller */
      }
      #nextBtn {
        right: 12.82%;
        top: 6.5%;
        width: 22%;    /* slightly bigger */
        height: 3.5%;  /* slightly taller */
      }
    }

    /* Mobile ≤699px */
    @media (max-width: 699px) {
      #prevBtn {
        left: 0.97%;
        top: 7.93%;
        width: 14.5%;   /* slightly bigger */
        height: 2.5%;   /* slightly taller */
        font-size: 14px;
      }
      #nextBtn {
        right: 5%;
        top: 7.93%;
        width: 14.5%;   /* slightly bigger */
        height: 2.5%;   /* slightly taller */
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

<!-- Navigation Buttons -->
<div id="prevBtn" onclick="prevLevel()">< Prev</div>
<div id="nextBtn" onclick="nextLevel()">Next ></div>

<!-- Game -->
<iframe id="gameFrame" src="https://enclose.horse/"></iframe>

<!-- Overlay -->
<div id="overlay">
  <div id="score" class="panel">Loading score...</div>
  <div id="timer" class="panel" onclick="toggleTimer()">00:00</div>
</div>

<script>
  // ===== Timer =====
  let seconds = 0;
  let running = true;
  const timerEl = document.getElementById("timer");

  function updateTimer() {
    if (!running) return;
    seconds++;
    const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
    const secs = String(seconds % 60).padStart(2, '0');
    timerEl.textContent = `${mins}:${secs}`;
  }

  function toggleTimer() {
    running = !running;
    timerEl.style.opacity = running ? "1" : "0.5";
  }

  setInterval(updateTimer, 1000);

  // ===== Helpers =====
  function getIsraelDateString() {
    return new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Jerusalem',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit'
    }).format(new Date());
  }

  const scoreEl = document.getElementById("score");
  const frame = document.getElementById("gameFrame");

  let currentDate = getIsraelDateString();

  // ===== Load Optimal Score =====
  async function loadOptimalScore(dateStr) {
    try {
      const dailyRes = await fetch(`https://enclose.horse/api/daily/${dateStr}`);
      const dailyData = await dailyRes.json();
      const levelId = dailyData.id;

      const statsRes = await fetch(`https://enclose.horse/api/levels/${levelId}/stats`);
      const statsData = await statsRes.json();

      let text = `Optimal: ${statsData.optimalScore}`;

      if (dailyData.hasBonus) {
        const bonusRes = await fetch(`https://enclose.horse/api/daily/bonus/${dailyData.id}`);
        const bonusData = await bonusRes.json();

        text += ` | <span style="color:#E8B8D0">Bonus: ${bonusData.optimalScore}</span>`;
      }

      scoreEl.innerHTML = text;
    } catch (err) {
      console.error("Failed to load optimal score:", err);
      scoreEl.textContent = "Score error";
    }
  }

  // ===== Level Navigation =====
  function setLevel(dateStr) {
    currentDate = dateStr;
    frame.src = `https://enclose.horse/play/${dateStr}`;
    loadOptimalScore(dateStr);
  }

  function changeDay(offset) {
    const d = new Date(currentDate);
    d.setDate(d.getDate() + offset);
    const newDate = d.toISOString().slice(0, 10);
    setLevel(newDate);
  }

  function resetTimer() {
    seconds = 0;        // reset seconds
    running = true;     // start counting immediately
    timerEl.style.opacity = "1"; // make sure timer is fully visible
  }

  function prevLevel() {
    changeDay(-1);
    resetTimer();
  }

  function nextLevel() {
    changeDay(1);
    resetTimer();
  }

  // ===== Initial Load =====
  loadOptimalScore(currentDate);
</script>

</body>
</html>
